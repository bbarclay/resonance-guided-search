<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }
    .bg-gradient {
      fill: url(#bg-gradient);
    }
    .title {
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      font-size: 60px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: 'Arial', sans-serif;
      font-size: 30px;
      fill: #e0e0e0;
    }
    .node {
      animation: pulse 3s infinite ease-in-out;
    }
    .node-1 {
      animation-delay: 0s;
    }
    .node-2 {
      animation-delay: 0.5s;
    }
    .node-3 {
      animation-delay: 1s;
    }
    .node-4 {
      animation-delay: 1.5s;
    }
    .node-5 {
      animation-delay: 2s;
    }
    .orbit {
      fill: none;
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 2;
      stroke-dasharray: 15, 10;
      animation: rotate 60s linear infinite;
    }
    .path {
      fill: none;
      stroke: #4CAF50;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 5s ease-in-out forwards;
    }
    .alt-path {
      stroke: #FF5722;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .formula {
      font-family: 'Arial', sans-serif;
      font-style: italic;
      font-size: 24px;
      fill: #ffffff;
    }
    .icon {
      animation: float 4s infinite ease-in-out;
    }
    .icon-1 {
      animation-delay: 0s;
    }
    .icon-2 {
      animation-delay: 1s;
    }
    .icon-3 {
      animation-delay: 2s;
    }
  </style>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a237e" />
      <stop offset="50%" stop-color="#283593" />
      <stop offset="100%" stop-color="#303f9f" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect class="bg-gradient" x="0" y="0" width="1200" height="400" />
  
  <!-- Grid lines -->
  <g>
    <!-- Horizontal grid lines -->
    <line class="grid-line" x1="0" y1="100" x2="1200" y2="100" />
    <line class="grid-line" x1="0" y1="200" x2="1200" y2="200" />
    <line class="grid-line" x1="0" y1="300" x2="1200" y2="300" />
    
    <!-- Vertical grid lines -->
    <line class="grid-line" x1="200" y1="0" x2="200" y2="400" />
    <line class="grid-line" x1="400" y1="0" x2="400" y2="400" />
    <line class="grid-line" x1="600" y1="0" x2="600" y2="400" />
    <line class="grid-line" x1="800" y1="0" x2="800" y2="400" />
    <line class="grid-line" x1="1000" y1="0" x2="1000" y2="400" />
  </g>
  
  <!-- Orbits -->
  <g transform="translate(600, 200)">
    <circle class="orbit" r="50" />
    <circle class="orbit" r="100" />
    <circle class="orbit" r="150" />
    <circle class="orbit" r="200" />
  </g>
  
  <!-- Nodes -->
  <g filter="url(#glow)">
    <circle class="node node-1" cx="600" cy="200" r="15" fill="#4CAF50" />
    <circle class="node node-2" cx="650" cy="150" r="10" fill="#2196F3" />
    <circle class="node node-3" cx="700" cy="250" r="12" fill="#FFC107" />
    <circle class="node node-4" cx="550" cy="250" r="8" fill="#9C27B0" />
    <circle class="node node-5" cx="500" cy="150" r="10" fill="#FF5722" />
  </g>
  
  <!-- Paths -->
  <g>
    <path class="path" d="M 600,200 C 650,150 700,250 750,200 S 850,150 900,200" />
    <path class="path alt-path" d="M 600,200 C 550,250 500,150 450,200 S 350,250 300,200" />
  </g>
  
  <!-- Icons -->
  <g>
    <text class="icon icon-1" x="300" y="150" font-family="Arial" font-size="40" fill="#FFC107">A(x, d)</text>
    <text class="icon icon-2" x="850" y="150" font-family="Arial" font-size="40" fill="#4CAF50">RGM</text>
    <text class="icon icon-3" x="600" y="320" font-family="Arial" font-size="40" fill="#2196F3">A*</text>
  </g>
  
  <!-- Formula -->
  <text class="formula" x="450" y="100">d_rgm(x₁, x₂) = d_base(x₁, x₂) · f_mod(A₁, A₂)</text>
  
  <!-- Title and subtitle -->
  <g>
    <text class="title" x="600" y="80" text-anchor="middle">Resonance-Guided Search</text>
    <text class="subtitle" x="600" y="120" text-anchor="middle">A Novel Heuristic Framework for Adaptive Pathfinding</text>
  </g>
</svg>
